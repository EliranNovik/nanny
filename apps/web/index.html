<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA Meta Tags -->
    <!-- Match app background so Safari toolbar / overscroll doesn’t flash a mismatched band -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101214" media="(prefers-color-scheme: dark)" />
    <script>
      (function () {
        var path = (location.pathname || "/").replace(/\/$/, "") || "/";
        if (path !== "/") return;
        document.documentElement.classList.add("landing-cream");
        document.documentElement.style.backgroundColor = "#FAF6EF";
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < metas.length; i++) metas[i].setAttribute("content", "#FAF6EF");
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tebnu" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Tebnu is a local help app. Find trusted helpers for home, childcare, cooking, errands, and more — or offer your skills nearby." />
    <meta name="application-name" content="Tebnu" />

    <!-- Open Graph / social. Canonical + og:url are set per route in JS so the SPA shell does not claim every URL is the homepage. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tebnu" />
    <meta property="og:title" content="Tebnu - Your Helper for Home &amp; Life" />
    <meta property="og:description" content="Tebnu is a local help app. Find trusted helpers for home, childcare, cooking, errands, and more — or offer your skills nearby." />
    <meta property="og:image" content="https://www.tebnu.com/images/landing-hero-babysitting.jpg" />
    <meta property="og:image:secure_url" content="https://www.tebnu.com/images/landing-hero-babysitting.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1152" />
    <meta property="og:image:height" content="864" />
    <meta property="og:image:alt" content="Help is closer than you think" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="he_IL" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta property="og:locale:alternate" content="ru_RU" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tebnu - Your Helper for Home &amp; Life" />
    <meta name="twitter:description" content="Tebnu is a local help app. Find trusted helpers for home, childcare, cooking, errands, and more — or offer your skills nearby." />
    <meta name="twitter:image" content="https://www.tebnu.com/images/landing-hero-babysitting.jpg" />
    <meta name="twitter:image:alt" content="Help is closer than you think" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.tebnu.com/#organization",
          "name": "Tebnu",
          "url": "https://www.tebnu.com/",
          "logo": "https://www.tebnu.com/brand-mark.png",
          "email": "info@tebnu.com"
        },
        {
          "@type": "WebSite",
          "@id": "https://www.tebnu.com/#website",
          "url": "https://www.tebnu.com/",
          "name": "Tebnu",
          "description": "Tebnu is a local help app. Find trusted helpers for home, childcare, cooking, errands, and more — or offer your skills nearby.",
          "publisher": { "@id": "https://www.tebnu.com/#organization" },
          "inLanguage": ["en", "he", "fr", "ru"]
        }
      ]
    }
    </script>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/brand-mark.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/brand-mark.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/brand-mark.png" />
    
    <!-- Fonts. Non-blocking so the first screen is not held on the stylesheet. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" />
    </noscript>

    <link rel="preload" as="image" href="/images/landing-hero-babysitting.jpg" fetchpriority="high" />
    
    <title>Tebnu - Your Helper for Home & Life</title>
  </head>
  <body>
    <div id="root">
      <!-- First paint while the landing app loads: logo beside the map radar. No headline or buttons. -->
      <style>
        html, body { margin: 0; background: #ffffff; }
        #boot-splash { display: none; }
        #boot-splash.is-home {
          box-sizing: border-box;
          min-height: 100svh;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 1.5rem;
          background: #FAF6EF;
          font-family: "DM Sans", system-ui, sans-serif;
        }
        #boot-splash .stage {
          display: flex;
          align-items: center;
          gap: 1.25rem;
        }
        #boot-splash .brand {
          display: flex;
          align-items: center;
          color: #09090b;
        }
        #boot-splash .brand img { height: 5.5rem; width: auto; }
        #boot-splash .brand b {
          margin-left: -0.35rem;
          font-weight: 900;
          font-size: 2.35rem;
          letter-spacing: -0.045em;
        }
        #boot-splash .loader {
          position: relative;
          width: 11rem;
          height: 7.75rem;
          overflow: hidden;
          border-radius: 1.25rem;
          background: rgba(226, 236, 220, 0.62);
        }
        #boot-splash .loader .map { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.8; }
        #boot-splash .loader .radar {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 4.5rem;
          height: 4.5rem;
          margin: -2.25rem 0 0 -2.25rem;
        }
        #boot-splash .loader .rings,
        #boot-splash .loader .sweep {
          position: absolute;
          inset: 0;
          border-radius: 999px;
        }
        #boot-splash .loader .rings {
          border: 1px solid rgba(5, 150, 105, 0.32);
          box-shadow: inset 0 0 0 10px rgba(16, 185, 129, 0.08), inset 0 0 0 20px rgba(16, 185, 129, 0.05);
        }
        #boot-splash .loader .sweep {
          background: conic-gradient(from 0deg, transparent 0 62%, rgba(16,185,129,0.04) 76%, rgba(5,150,105,0.42) 100%);
          animation: boot-spin 2.6s linear infinite;
        }
        #boot-splash .loader .dot {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 0.5rem;
          height: 0.5rem;
          margin: -0.25rem 0 0 -0.25rem;
          border-radius: 999px;
          background: #059669;
          box-shadow: 0 0 0 4px rgba(16,185,129,0.28);
        }
        @keyframes boot-spin { to { transform: rotate(360deg); } }
        @media (min-width: 768px) {
          #boot-splash .stage { gap: 1.75rem; }
          #boot-splash .brand img { height: 7.5rem; }
          #boot-splash .brand b { margin-left: -0.45rem; font-size: 3.15rem; }
          #boot-splash .loader {
            width: 18rem;
            height: 12.5rem;
            border-radius: 1.75rem;
          }
          #boot-splash .loader .radar { width: 8.5rem; height: 8.5rem; margin: -4.25rem 0 0 -4.25rem; }
          #boot-splash .loader .rings {
            box-shadow: inset 0 0 0 18px rgba(16, 185, 129, 0.08), inset 0 0 0 36px rgba(16, 185, 129, 0.05);
          }
        }
      </style>
      <div id="boot-splash">
        <div class="stage">
          <div class="brand">
            <img src="/brand-mark.png" alt="" />
            <b>tebnu</b>
          </div>
          <div class="loader" aria-hidden="true">
            <svg class="map" viewBox="0 0 240 160" preserveAspectRatio="none">
              <g fill="none" stroke="#fff" stroke-linecap="round">
                <path d="M-8 40 H250" stroke-width="8" />
                <path d="M-8 104 H250" stroke-width="7" />
                <path d="M62 -8 V170" stroke-width="7" />
                <path d="M168 -8 V170" stroke-width="7" />
                <path d="M-8 74 H250" stroke-width="3" />
                <path d="M116 -8 V170" stroke-width="3" />
              </g>
              <g fill="#d7e3cf">
                <rect x="74" y="50" width="34" height="20" rx="3" />
                <rect x="182" y="24" width="38" height="20" rx="3" />
                <rect x="126" y="114" width="30" height="22" rx="3" />
              </g>
            </svg>
            <span class="radar"><span class="rings"></span><span class="sweep"></span><span class="dot"></span></span>
          </div>
        </div>
      </div>
      <script>
        (function () {
          var explicit = "";
          var stored = "";
          try {
            explicit = localStorage.getItem("app-locale-explicit") || "";
            stored = localStorage.getItem("app-locale") || "";
          } catch (e) {}
          var supported = { en: 1, he: 1, ru: 1, fr: 1 };
          var list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"];
          var browser = "en";
          for (var i = 0; i < list.length; i++) {
            var base = String(list[i] || "").split("-")[0];
            if (supported[base]) { browser = base; break; }
          }
          var lang = explicit === "1" && supported[stored] ? stored : browser;
          document.documentElement.setAttribute("lang", lang);
          document.documentElement.setAttribute("dir", lang === "he" ? "rtl" : "ltr");

          var path = (location.pathname || "/").replace(/\/$/, "") || "/";
          var splash = document.getElementById("boot-splash");
          if (path !== "/") {
            if (splash) splash.remove();
            return;
          }
          if (splash) splash.className = "is-home";
        })();
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
