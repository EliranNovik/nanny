<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA Meta Tags -->
    <!-- Match app background so Safari toolbar / overscroll doesn’t flash a mismatched band -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101214" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tebnu" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Tebnu is a local help app. Find trusted helpers for home, childcare, cooking, errands, and more — or offer your skills nearby." />
    <meta name="application-name" content="Tebnu" />

    <!-- Open Graph / social. Canonical + og:url are set per route in JS so the SPA shell does not claim every URL is the homepage. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tebnu" />
    <meta property="og:title" content="Tebnu - Your Helper for Home &amp; Life" />
    <meta property="og:description" content="Tebnu is a local help app. Find trusted helpers for home, childcare, cooking, errands, and more — or offer your skills nearby." />
    <meta property="og:image" content="https://www.tebnu.com/ChatGPT%20Image%20Aug%2023,%202026%20at%2011_08_39%20AM.png" />
    <meta property="og:image:secure_url" content="https://www.tebnu.com/ChatGPT%20Image%20Aug%2023,%202026%20at%2011_08_39%20AM.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1536" />
    <meta property="og:image:height" content="864" />
    <meta property="og:image:alt" content="Tebnu local help community" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="he_IL" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta property="og:locale:alternate" content="ru_RU" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tebnu - Your Helper for Home &amp; Life" />
    <meta name="twitter:description" content="Tebnu is a local help app. Find trusted helpers for home, childcare, cooking, errands, and more — or offer your skills nearby." />
    <meta name="twitter:image" content="https://www.tebnu.com/ChatGPT%20Image%20Aug%2023,%202026%20at%2011_08_39%20AM.png" />
    <meta name="twitter:image:alt" content="Tebnu local help community" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.tebnu.com/#organization",
          "name": "Tebnu",
          "url": "https://www.tebnu.com/",
          "logo": "https://www.tebnu.com/brand-mark.png",
          "email": "info@tebnu.com"
        },
        {
          "@type": "WebSite",
          "@id": "https://www.tebnu.com/#website",
          "url": "https://www.tebnu.com/",
          "name": "Tebnu",
          "description": "Tebnu is a local help app. Find trusted helpers for home, childcare, cooking, errands, and more — or offer your skills nearby.",
          "publisher": { "@id": "https://www.tebnu.com/#organization" },
          "inLanguage": ["en", "he", "fr", "ru"]
        }
      ]
    }
    </script>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/brand-mark.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/brand-mark.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/brand-mark.png" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS for fallback maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    
    <title>Tebnu - Your Helper for Home & Life</title>
  </head>
  <body>
    <div id="root">
      <!-- Replaced on React mount; mobile keeps the logo splash. Desktop skips it so landing paints immediately. -->
      <style>
        @media (min-width: 768px) {
          #boot-splash { display: none !important; }
        }
      </style>
      <div
        id="boot-splash"
        style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#ffffff;padding:24px;box-sizing:border-box;"
      >
        <img
          src="/brand-mark.png"
          alt="Tebnu"
          width="280"
          height="280"
          decoding="async"
          style="max-width:min(280px,85vw);max-height:40vh;width:auto;height:auto;object-fit:contain;"
        />
        <p style="margin:16px 0 0;max-width:28rem;text-align:center;font:500 16px/1.45 system-ui,sans-serif;color:#475569;">
          Tebnu is a local help app. Find trusted helpers for home, childcare, cooking, errands, and more — or offer your skills nearby.
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
